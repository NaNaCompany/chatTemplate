<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Chat</title>
    <meta name="description" content="A self-chat simulator where you play both parts.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="chat-header">
            <div class="header-content">
                <h1>AI Chat</h1>
                <span class="subtitle">Gemini-3.0-Pro</span>
            </div>
            <div class="header-controls">
                <!-- Future controls could go here -->
            </div>
        </header>

        <main class="chat-viewport" id="chatViewport">
            <div class="chat-messages" id="chatMessages">
                <div class="message-group system-message">
                    <div class="timestamp">Gemini-3.0-Pro</div>
                </div>
                <!-- Messages will appear here -->
            </div>
        </main>

        <footer class="chat-input-area">
            <form id="chatForm" class="input-wrapper">
                <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                <button type="submit" id="sendBtn" aria-label="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
