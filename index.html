    <div id="onboarding-overlay">
        <div class="hint-arrow hint-title">
            <div class="arrow"></div>
            <p>Click to Toggle Theme</p>
        </div>
        <div class="hint-arrow hint-model">
            <div class="arrow"></div>
            <p>Click to Rename Model</p>
        </div>
        <div class="hint-arrow hint-input">
            <div class="arrow"></div>
            <p>Type to Chat</p>
        </div>
        <div class="overlay-msg">Click anywhere to start</div>
    </div>
    <div class="app-container">
        <header class="chat-header">
            <div class="header-content">
                <h1>AI Chat</h1>
                <span class="subtitle">Gemini-3.0-Pro</span>
            </div>
            <div class="header-controls">
                <!-- Future controls could go here -->
            </div>
        </header>

        <main class="chat-viewport" id="chatViewport">
            <div class="chat-messages" id="chatMessages">
                <div class="message-group system-message">
                    <div class="timestamp">Gemini-3.0-Pro</div>
                </div>
                <!-- Messages will appear here -->
            </div>
        </main>

        <footer class="chat-input-area">
            <form id="chatForm" class="input-wrapper">
                <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                <button type="submit" id="sendBtn" aria-label="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="script.js"></script>
